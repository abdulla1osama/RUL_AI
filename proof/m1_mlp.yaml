data:
  root: data/servo_rul_v1
  split: data/servo_rul_v1/split_manifest.json
  rul_cap: 130            # piecewise-linear RUL cap (see DATASHEET / assignment Sec. 12)

model:
  name: mlp             # one of: linear, mlp, cnn1d, cnn2d_transfer
  window: 30
  hidden_sizes: [64, 32]
  dropout: 0.2

training:
  seed: 42
  deterministic: true
  max_epochs: 120
  batch_size: 64
  lr: 5.0e-4

output:
  dir: runs/mkt3432_proof_workspace